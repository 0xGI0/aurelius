<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurelius</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #F4EEE1; color: #1B2531;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #FBF7ED; border: 1px solid #E2D9C6; border-radius: 20px;
            padding: 32px; max-width: 420px; margin: 20px; text-align: center; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #5A6575; line-height: 1.5; }
    .brand { letter-spacing: 5px; font-size: 13px; color: #A6763C; font-weight: 600; margin-bottom: 20px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin: 6px 0;
            border: 1px solid #E2D9C6; border-radius: 12px; background: #fff; font-size: 15px; }
    button { margin-top: 12px; padding: 11px 24px; border: 0; border-radius: 999px;
             background: #A6763C; color: #F4EEE1; font-weight: 700; font-size: 15px; cursor: pointer; }
    .err { color: #A6763C; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      body { background: #0F151D; color: #EAE2D2; }
      .card { background: #161F2A; border-color: #26303D; }
      p { color: #9AA3B0; }
      .brand, .err { color: #C9A264; }
      input { background: #0F151D; border-color: #26303D; color: #EAE2D2; }
      button { background: #C9A264; color: #0F151D; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">AURELIUS</div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
