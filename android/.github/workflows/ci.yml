name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: JVM-Tests
        run: ./gradlew test --no-daemon --console=plain
      - name: Debug-Build
        run: ./gradlew assembleDebug --no-daemon --console=plain
